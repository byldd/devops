services:
  frontend:
    depends_on:
      - backend
    image: ${ECR_FRONTEND_REPO_URI}
    container_name: frontend
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    restart: always
    entrypoint:
      [
        "/bin/bash",
        "-c",
        "infisical run --token=$(infisical login --method=universal-auth --client-id=${INFISICAL_CLIENT_ID} --client-secret=${INFISICAL_CLIENT_SECRET} --silent --plain) --env=${INFISICAL_ENV} --projectId=${INFISICAL_PROJECT_ID} --path=/frontend -- node server.js",
      ]
    networks:
      - app-network

  backend:
    container_name: backend
    image: ${ECR_BACKEND_REPO_URI}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    restart: "always"
    entrypoint:
      [
        "/bin/bash",
        "-c",
        "infisical run --token=$(infisical login --method=universal-auth --client-id=${INFISICAL_CLIENT_ID} --client-secret=${INFISICAL_CLIENT_SECRET} --silent --plain) --env=${INFISICAL_ENV} --projectId=${INFISICAL_PROJECT_ID} --path=/backend -- node ./server/index.js",
      ]
    # Uncomment them if you're on firebase boilerplate
    # volumes:
    #   - './firebase-cert.json:/app/lib/firebase-cert.json'
    networks:
      - app-network

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ubuntu/.docker/config.json:/config.json
      - helper:/go/bin
    environment:
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - PATH=$PATH:/go/bin
      - HOME=/
    command: --cleanup --rolling-restart --interval 30 frontend backend

networks:
  app-network:
    driver: bridge

volumes:
  helper:
    external: true
